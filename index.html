<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вопросы оракулу</title>
    <!-- Шрифт Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            --lilac-neon: #d896ff;
            --lilac-glow: rgba(216, 150, 255, 0.7);
            --gold-accent: #f5d38c;
            --btn-gradient: linear-gradient(135deg, #7928ca, #b83bfe 50%, #f39c12 100%);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #07030c;
            font-family: 'Playfair Display', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        /* Главное окно игры с пропорцией 16:9 */
        .game-wrapper {
            position: relative;
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            max-width: 177.78vh;
            background: url('bg.jpg') no-repeat center center;
            background-size: cover;
            box-shadow: 0 0 70px rgba(0, 0, 0, 0.95);
            overflow: hidden;
        }

        .ambient-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(6, 2, 12, 0.55) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* ================= КАРТА СЛЕВА (ПО ЦЕНТРУ ЭКРАНА) ================= */
        .card-stage {
            position: absolute;
            left: 10%;
            top: 50%;
            transform: translateY(-50%);
            width: 19.5%;
            height: 64%;
            perspective: 1500px;
            -webkit-perspective: 1500px;
            z-index: 10;
        }

        .magic-card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Поворот на 180 градусов */
        .magic-card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Тень и сияние прямо на сторонах карты, чтобы не ломать 3D-вращение */
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 15px var(--lilac-glow));
        }

        /* 1. Рубашка карты */
        .card-back {
            background-image: url('card_back.png');
            transform: rotateY(0deg) translateZ(1px);
        }

        /* Кнопка "ВЫТЯНИ КАРТУ" */
        .btn-draw {
            background: var(--btn-gradient);
            border: 1px solid rgba(255, 255, 255, 0.7);
            color: #ffffff;
            padding: 11px 22px;
            font-family: 'Playfair Display', serif;
            font-size: clamp(0.75rem, 1.05vw, 1.15rem);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--lilac-neon), inset 0 0 10px rgba(255, 255, 255, 0.6);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
            transition: all 0.3s ease;
            animation: pulse-glow 2.2s infinite alternate;
        }

        .btn-draw:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px #ffffff, 0 0 45px var(--lilac-neon);
        }

        .btn-draw.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.6);
        }

        /* 2. Лицевая сторона карты */
        .card-front {
            background-image: url('card_front.png');
            transform: rotateY(180deg) translateZ(1px);
            padding: 22% 14% 18% 14%;
            text-align: center;
        }

        /* Текст вопроса: скрыт до окончания поворота карты */
        .question-text {
            color: #faebd7;
            font-size: clamp(0.75rem, 1.05vw, 1.25rem);
            font-weight: 600;
            line-height: 1.45;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95), 0 0 12px rgba(245, 211, 140, 0.5);
            opacity: 0;
            transform: translateY(12px) scale(0.96);
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        /* Класс, который делает текст видимым ПОСЛЕ поворота */
        .question-text.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* ================= ХРУСТАЛЬНЫЙ ШАР СПРАВА (ПО ЦЕНТРУ ЭКРАНА) ================= */
        .crystal-ball-zone {
            position: absolute;
            left: 85.3%;
            top: 45%;
            transform: translate(-50%, -50%);
            width: 22.5%;
            height: 40%;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        /* Кнопка "ПОЛУЧИТЬ ОТВЕТ" */
        .btn-answer {
            pointer-events: auto;
            background: var(--btn-gradient);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 12px 22px;
            font-family: 'Playfair Display', serif;
            font-size: clamp(0.75rem, 1.05vw, 1.2rem);
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 0 25px var(--lilac-neon), inset 0 0 12px rgba(255, 255, 255, 0.6);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
            opacity: 0;
            transform: scale(0.7);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: none;
        }

        .btn-answer.visible {
            display: block;
            opacity: 1;
            transform: scale(1);
            animation: pulse-btn 2.2s infinite;
        }

        .btn-answer:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px #f39c12, inset 0 0 15px #fff;
        }

        /* Текст ответа внутри шара */
        .answer-display {
            position: absolute;
            width: 84%;
            text-align: center;
            color: #ffffff;
            font-size: clamp(0.85rem, 1.15vw, 1.35rem);
            font-weight: 700;
            line-height: 1.4;
            padding: 10px;
            text-shadow: 0 0 12px var(--lilac-neon), 0 0 24px #ba55d3, 0 0 35px #7b1fa2;
            opacity: 0;
            transform: scale(0.7);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: none;
        }

        .answer-display.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        /* Мерцание шара */
        .flicker-effect {
            animation: crystal-flicker 1.1s ease-out;
        }

        /* ================= АНИМАЦИИ ================= */
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 15px var(--lilac-glow); }
            100% { box-shadow: 0 0 30px var(--lilac-neon), 0 0 45px var(--lilac-glow); }
        }

        @keyframes pulse-btn {
            0% { box-shadow: 0 0 15px var(--lilac-neon); }
            50% { box-shadow: 0 0 30px #b83bfe, 0 0 45px rgba(243, 156, 18, 0.8); }
            100% { box-shadow: 0 0 15px var(--lilac-neon); }
        }

        @keyframes crystal-flicker {
            0% { filter: brightness(1); }
            20% { filter: brightness(2.6) drop-shadow(0 0 40px #f39c12); }
            45% { filter: brightness(1.4) drop-shadow(0 0 20px #b83bfe); }
            65% { filter: brightness(2.8) drop-shadow(0 0 50px #fff); }
            85% { filter: brightness(1.8) drop-shadow(0 0 25px var(--lilac-neon)); }
            100% { filter: brightness(1); }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="ambient-overlay"></div>

        <!-- КАРТА СЛЕВА -->
        <div class="card-stage">
            <div class="magic-card" id="magicCard">
                <!-- Рубашка -->
                <div class="card-face card-back">
                    <button class="btn-draw" id="btnDraw">ВЫТЯНИ КАРТУ</button>
                </div>
                <!-- Лицевая сторона -->
                <div class="card-face card-front">
                    <div class="question-text" id="questionText"></div>
                </div>
            </div>
        </div>

        <!-- ХРУСТАЛЬНЫЙ ШАР СПРАВА -->
        <div class="crystal-ball-zone" id="crystalZone">
            <button class="btn-answer" id="btnAnswer">ПОЛУЧИТЬ&nbsp;ОТВЕТ</button>
            <div class="answer-display" id="answerDisplay">
                <p id="answerText"></p>
            </div>
        </div>
    </div>

    <!-- ТЕГИ АУДИО -->
    <audio id="audioFlip" src="card_flip.mp3" preload="auto"></audio>
    <audio id="audioMagic" src="magic_reveal.mp3" preload="auto"></audio>

    <script>
        // 50 ВОПРОСОВ
        const questions = [
            "Взорвётся ли у меня зелье в ближайшее время",
            "Напугает ли меня до икоты то, что вылезет из шкафа при встрече с Боггартом?",
            "Найду ли я ответ на свой главный секрет в Запретной Секции?",
            "Чихает ли моя палочка искрами из-за того, что просто отказывается мне гадать?",
            "Почувствую ли я в зелье Амортенция запах своего краша?",
            "Позовет ли меня кто-нибудь на Святочный бал (чтобы не идти с гигантским кальмаром)?",
            "Подмешали ли мне любовное зелье в тыквенный сок?",
            "Случится ли катастрофа, если я решительно поцелую своего краша под омелой?",
            "Выгонят ли меня из школы, если я отправлю валентинку с поющим гномом?",
            "Смогу ли я найти идеального напарника для дуэли в Дуэльном клубе?",
            "Стоит ли мне наложить проклятие на того, кто забрал мой последний чистый свитер?",
            "Пускают ли прямо сейчас обо мне слух по всей школе?",
            "Разобью ли я себе нос, если попробую сыграть в квиддич?",
            "Мои пропавшие носки действительно крадут домовые эльфы или гномы?",
            "Распределит ли меня Шляпа на факультет в мои ...дцать лет, если я очень попрошу?",
            "Связан ли странный шум из гостиной после отбоя с варкой незаконного зелья?",
            "Забуду ли я пароль от гостиной в самый несподходящий момент, оставшись ночевать в коридоре?",
            "Подсунут ли мне в \"Сладком королевстве\" драже со вкусом ушной серы?",
            "Съест ли существо под моей кроватью мои старые мантии до конца недели?",
            "Поможет ли мне Карта Мародёров незаметно гулять ночами по замку?",
            "Приведет ли меня тайный ход из полуподземелий Пуффендуя к чему-то действительно стоящему?",
            "Появится ли Выручай-комната, если мне срочно понадобятся комментарии к домашкам студентов?",
            "Окажется ли моя новая открывалка для сока проклятым темным артефактом из Лютного переулка?",
            "Превращусь ли я в какую-нибудь абсурдную зверушку (вроде хомяка), если освою Анимагию?",
            "Примет ли мой Патронус форму какого-нибудь величественного зверя?",
            "Залезли ли прямо сейчас Мозгошмыги мне в голову, мешая думать о вечном?",
            "Являются ли мои жизненные проблемы результатом проклятия, которое я сам на себя наложил?",
            "Покажет ли мне Зеркало Еиналеж нечто большее, чем просто тарелку с вкусной едой?",
            "Содержит ли моя идеальная палочка перо феникса в своей сердцевине?",
            "Смотрит ли мой филин на меня с презрением потому, что просто недоволен чаевыми?",
            "Совершу ли я грандиозную глупость, если мне в руки попадет Маховик Времени?",
            "Скажет ли мне Магический Шар \"Да\", если я спрошу, скоро ли каникулы?",
            "Пробудится ли источник моей истинной, неукротимой силы в ближайшее время?",
            "Требуют ли мои внутренние стихии (Огонь, Вода, Земля, Воздух) немедленного баланса прямо сейчас?",
            "Блокируют ли мои собственные страхи поток моей магической энергии?",
            "Смогу ли я сотворить \"золото\" из свинца\" моих сегодняшних трудностей?",
            "Высока ли вероятность того, что вместо боевого заклинания я случайно призову пучок редиски?",
            "Наложил ли я случайно проклятие на свой будильник, раз он так искренне ненавидит меня по утрам?",
            "Смогу ли я незаметно утащить весь торт с праздничного пира, если стану невидимым?",
            "Действительно ли мой филин считает меня самым бестолковым магом в замке?",
            "Уйдут ли садовые гномы из-под моего окна, если я попрошу их об этом вежливо?",
            "Наложит ли библиотекарь на меня проклятие за пятно от тыквенного сока на древнем издании?",
            "Движущиеся лестницы меняют направление специально, чтобы я опять опоздал?",
            "Сплетничают ли портреты в коридоре обо мне, когда я прохожу мимо?",
            "Звучит ли древнее пророчество обо мне как грандиозная эпическая поэма?",
            "Стану ли я в будущем Тёмным Лордом (если, конечно, побежу свою лень)?",
            "Приготовила ли мне судьба мелкую пакость на этих выходных?",
            "Накажут ли меня, если я случайно вылезу из камина прямо в кабинете директора?",
            "Поймёт ли домовый эльф, что гора вещей на моём стуле - это \"творческий порядок\", а не хаос?",
            "Сливает ли кто-то из моих близких друзей мои секреты говорящим портретам?"
        ];

        // 20 ОТВЕТОВ
        const answers = [
            'Магия говорит "Да", здравый смысл — "Беги!"',
            'Туман слишком густой. Спроси после обеда.',
            'Даже домашние эльфы знают, что нет.',
            'Мозгошмыги съели твоё будущее, повтори вопрос.',
            'Да, но тебе это очень не понравится.',
            'Мерлинова борода, ну и вопросики у тебя!',
            '100 баллов твоему факультету! (Это значит "Да")',
            'Сбой в эфире. Потряси меня сильнее!',
            'Лучше прыгни в кипящий котёл - это безопаснее.',
            'Сначала дай тыквенную печеньку, потом отвечу.',
            'Твой внутренний оракул уже орёт: "НЕ НАДО!"',
            'Звёзды смеются. И я вместе с ними.',
            'Даже Тёмные Лорды до такого не додумывались.',
            'Судьба в раздумьях. Лучше брось монетку.',
            'Определённо да! (Если ты не накосячишь).',
            'Готовься, сейчас что-то взорвётся... (Это ответ, если что)',
            'Занимаюсь медитацией. Не мешай.',
            'Спроси у совы, я ухожу на каникулы.',
            'Все знаки указывают на триумф... и еду!',
            'Забудь. Иди лучше поспи.'
        ];

        // Элементы
        const magicCard = document.getElementById('magicCard');
        const btnDraw = document.getElementById('btnDraw');
        const questionText = document.getElementById('questionText');
        const btnAnswer = document.getElementById('btnAnswer');
        const crystalZone = document.getElementById('crystalZone');
        const answerDisplay = document.getElementById('answerDisplay');
        const answerText = document.getElementById('answerText');

        const audioFlip = document.getElementById('audioFlip');
        const audioMagic = document.getElementById('audioMagic');

        // Встроенный синтезатор звука
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (type === 'flip' && audioFlip.src && !audioFlip.error) {
                audioFlip.currentTime = 0;
                audioFlip.play().catch(() => playSynthSound('flip'));
                return;
            }
            if (type === 'magic' && audioMagic.src && !audioMagic.error) {
                audioMagic.currentTime = 0;
                audioMagic.play().catch(() => playSynthSound('magic'));
                return;
            }
            playSynthSound(type);
        }

        function playSynthSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;

            if (type === 'flip') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.exponentialRampToValueAtTime(550, now + 0.25);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'magic') {
                [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.07);
                    gain.gain.setValueAtTime(0, now + idx * 0.07);
                    gain.gain.linearRampToValueAtTime(0.2, now + idx * 0.07 + 0.04);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.7);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.07);
                    osc.stop(now + idx * 0.07 + 0.7);
                });
            }
        }

        let isBusy = false;
        let answerClearTimer = null;

        // 1. НАЖАТИЕ: "ВЫТЯНИ КАРТУ"
        btnDraw.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isBusy) return;

            // Если в шаре оставался прошлый ответ — скрываем
            clearTimeout(answerClearTimer);
            answerDisplay.classList.remove('show');

            playSound('flip');

            // Кнопка на рубашке растворяется
            btnDraw.classList.add('hidden');

            // Подготавливаем вопрос (пока скрыт)
            questionText.classList.remove('visible');
            const randomQuestion = questions[Math.floor(Math.random() * questions.length)];
            questionText.textContent = randomQuestion;

            // Карта поворачивается (0.8s)
            magicCard.classList.add('flipped');

            // ПОСЛЕ завершения поворота проявляем вопрос
            setTimeout(() => {
                questionText.classList.add('visible');
                
                // Включаем кнопку на шаре
                setTimeout(() => {
                    btnAnswer.classList.add('visible');
                }, 300);
            }, 800);
        });

        // 2. НАЖАТИЕ: "ПОЛУЧИТЬ ОТВЕТ"
        btnAnswer.addEventListener('click', () => {
            if (isBusy) return;
            isBusy = true;

            playSound('magic');

            // Скрываем кнопку в шаре и текст на карте
            btnAnswer.classList.remove('visible');
            questionText.classList.remove('visible');

            // Мерцание шара
            crystalZone.classList.add('flicker-effect');

            setTimeout(() => {
                // Показываем ответ в шаре
                const randomAnswer = answers[Math.floor(Math.random() * answers.length)];
                answerText.textContent = randomAnswer;
                answerDisplay.classList.add('show');
                crystalZone.classList.remove('flicker-effect');

                // Карта поворачивается обратно рубашкой вверх
                magicCard.classList.remove('flipped');
                playSound('flip');

                // По возвращении карты возвращаем кнопку "ВЫТЯНИ КАРТУ"
                setTimeout(() => {
                    questionText.textContent = "";
                    btnDraw.classList.remove('hidden');
                    isBusy = false;
                }, 850);

                // Очищаем шар через 6 секунд
                answerClearTimer = setTimeout(() => {
                    answerDisplay.classList.remove('show');
                }, 6000);

            }, 600);
        });
    </script>
</body>
</html>
